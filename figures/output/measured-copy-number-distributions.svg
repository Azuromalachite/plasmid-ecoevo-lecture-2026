<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="48.0" y="42.0" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#1b1f23" text-anchor="start" font-weight="bold">The spread is as large as the mean</text>
  <text x="48.0" y="66.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#5a6570" text-anchor="start" font-weight="normal">Single-cell plasmid counts in E. coli for four origins. Standard deviations are on the order of the means, so the</text>
  <text x="48.0" y="84.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#5a6570" text-anchor="start" font-weight="normal">copy-number heterogeneity the companion figure assumes is measured, and larger than most of the curves it draws.</text>
  <line x1="150.0" y1="136" x2="150.0" y2="336" stroke="#d8d8d8" stroke-width="1"/>
  <text x="150.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a6570" text-anchor="middle" font-weight="normal">10⁰</text>
  <line x1="364.3" y1="136" x2="364.3" y2="336" stroke="#d8d8d8" stroke-width="1"/>
  <text x="364.3" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a6570" text-anchor="middle" font-weight="normal">10¹</text>
  <line x1="578.7" y1="136" x2="578.7" y2="336" stroke="#d8d8d8" stroke-width="1"/>
  <text x="578.7" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a6570" text-anchor="middle" font-weight="normal">10²</text>
  <text x="380.0" y="378.0" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1b1f23" text-anchor="middle" font-weight="normal">Plasmid copies per cell</text>
  <text x="134.0" y="130.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a6570" text-anchor="end" font-weight="bold">origin</text>
  <text x="650.0" y="130.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a6570" text-anchor="middle" font-weight="bold">mean</text>
  <text x="760.0" y="116.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a6570" text-anchor="middle" font-weight="bold">cells with</text>
  <text x="760.0" y="130.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a6570" text-anchor="middle" font-weight="bold">no plasmid</text>
  <rect x="150.0" y="163.5" width="193.6" height="18" rx="2" fill="none" stroke="#56B4E9" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="279.0" cy="172.5" r="6" fill="#0072B2"/>
  <text x="134.0" y="177.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="end" font-weight="bold">pSC101</text>
  <text x="650.0" y="177.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="middle" font-weight="normal">4</text>
  <text x="760.0" y="177.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="middle" font-weight="bold">5%</text>
  <text x="824.0" y="177.5" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">n = 858</text>
  <rect x="150.0" y="208.5" width="287.7" height="18" rx="2" fill="none" stroke="#56B4E9" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="373.2" cy="217.5" r="6" fill="#0072B2"/>
  <text x="134.0" y="222.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="end" font-weight="bold">p15A</text>
  <text x="650.0" y="222.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="middle" font-weight="normal">11</text>
  <text x="760.0" y="222.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="middle" font-weight="bold">3%</text>
  <text x="824.0" y="222.5" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">n = 553</text>
  <rect x="150.0" y="253.5" width="316.6" height="18" rx="2" fill="none" stroke="#56B4E9" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="402.1" cy="262.5" r="6" fill="#0072B2"/>
  <text x="134.0" y="267.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="end" font-weight="bold">ColE1</text>
  <text x="650.0" y="267.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="middle" font-weight="normal">15</text>
  <text x="760.0" y="267.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="middle" font-weight="bold">1%</text>
  <text x="824.0" y="267.5" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">n = 603</text>
  <rect x="150.0" y="298.5" width="445.7" height="18" rx="2" fill="none" stroke="#56B4E9" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="531.1" cy="307.5" r="6" fill="#0072B2"/>
  <text x="134.0" y="312.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="end" font-weight="bold">pUC</text>
  <text x="650.0" y="312.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="middle" font-weight="normal">60</text>
  <text x="760.0" y="312.5" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="middle" font-weight="bold">1%</text>
  <text x="824.0" y="312.5" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">n = 355</text>
  <text x="150.0" y="404.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">Dashed box spans the mean ± one mean: the paper reports the standard deviations only as being of that order, so it is a</text>
  <text x="150.0" y="420.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">statement about scale, not a measured interval. Many cells carried four times the mean or more.</text>
  <rect x="48" y="436" width="186" height="22" rx="3" fill="#1b1f23"/>
  <text x="141.0" y="451.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">WHAT IT DOES NOT SHOW</text>
  <text x="48.0" y="472.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1b1f23" text-anchor="start" font-weight="bold">A loss rate.</text>
  <text x="176.0" y="472.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">Those are standing plasmid-free fractions, under ampicillin and kanamycin selection, which acts against exactly the cells being counted.</text>
  <text x="48.0" y="489.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1b1f23" text-anchor="start" font-weight="bold">Multimerisation.</text>
  <text x="176.0" y="489.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">The strain is NEB 10-beta, deficient for recombinase, so the dimer route to plasmid-free cells is largely switched off here.</text>
  <text x="48.0" y="506.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1b1f23" text-anchor="start" font-weight="bold">Random partitioning.</text>
  <text x="176.0" y="506.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">Their model fits a partitioning coefficient, and they attribute residual error to further randomness in segregation.</text>
  <text x="48.0" y="529.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1b1f23" text-anchor="start" font-weight="bold">Adding the hok/sok toxin-antitoxin system gave the same distribution: it removes segregants, it does not narrow the spread that makes them.</text>
  <text x="48.0" y="547.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a6570" text-anchor="start" font-weight="normal">Values from the Results text of Shao et al. 2021, Nat Commun 12:1475 (CC BY 4.0); their Fig. 1e has the distribution shapes.  Source: shao2021singlecell</text>
</svg>
