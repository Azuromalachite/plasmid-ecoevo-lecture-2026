<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 0 800 386" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The segmented preference is between families, not within them</title>
<desc id="d">Pooled, the two-segment fit beats a single line by dAIC -148.1. Centred on plasmid family it beats it by only -1.3. Three breaks of the pooled magnitude planted into the centred data were recovered by the same test at around dAIC -45, so the near-zero observed value is an absence rather than a test without power.</desc>
<rect width="800" height="386" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="bold" fill="#1b1f23">The rescan misses a threshold the adjusted fit finds</text>
<text x="24" y="48" font-size="12" fill="#5a6570">&#916;AIC, two segments minus one line. More negative is stronger evidence for a bend.</text>
<line x1="250.0" y1="50" x2="250.0" y2="246" stroke="#d8d8d8" stroke-width="1"/>
<text x="250.0" y="264" font-size="11" fill="#5a6570" text-anchor="middle">&#8722;160</text>
<line x1="360.6" y1="50" x2="360.6" y2="246" stroke="#d8d8d8" stroke-width="1"/>
<text x="360.6" y="264" font-size="11" fill="#5a6570" text-anchor="middle">&#8722;120</text>
<line x1="471.2" y1="50" x2="471.2" y2="246" stroke="#d8d8d8" stroke-width="1"/>
<text x="471.2" y="264" font-size="11" fill="#5a6570" text-anchor="middle">&#8722;80</text>
<line x1="581.8" y1="50" x2="581.8" y2="246" stroke="#d8d8d8" stroke-width="1"/>
<text x="581.8" y="264" font-size="11" fill="#5a6570" text-anchor="middle">&#8722;40</text>
<line x1="692.4" y1="50" x2="692.4" y2="246" stroke="#d8d8d8" stroke-width="1"/>
<text x="692.4" y="264" font-size="11" fill="#5a6570" text-anchor="middle">0</text>
<line x1="692.4" y1="50" x2="692.4" y2="246" stroke="#5a6570" stroke-width="2"/>
<text x="238" y="74" font-size="12" text-anchor="end" fill="#1b1f23" font-weight="bold">Pooled, as published</text>
<rect x="282.8" y="60" width="409.6" height="20" rx="3" fill="#56B4E9"/>
<text x="684.4" y="74" font-size="12" text-anchor="end" fill="#ffffff" font-weight="bold">&#8722;148.1</text>
<text x="238" y="112" font-size="12" text-anchor="end" fill="#1b1f23" font-weight="bold">Knee fixed, family absorbed</text>
<rect x="638.8" y="98" width="53.5" height="20" rx="3" fill="#D55E00"/>
<text x="700.4" y="112" font-size="12" fill="#1b1f23" font-weight="bold">&#8722;19.4</text>
<text x="238" y="150" font-size="12" text-anchor="end" fill="#1b1f23" font-weight="bold">Knee re-fitted after centring</text>
<rect x="688.8" y="136" width="3.6" height="20" rx="3" fill="#009E73"/>
<text x="700.4" y="150" font-size="12" fill="#1b1f23" font-weight="bold">&#8722;1.3</text>
<text x="238" y="188" font-size="12" text-anchor="end" fill="#1b1f23">  simulated threshold, knee held</text>
<rect x="659.3" y="174" width="33.0" height="20" rx="3" fill="#D55E00"/>
<text x="700.4" y="188" font-size="12" fill="#1b1f23" font-weight="bold">&#8722;11.9</text>
<text x="238" y="226" font-size="12" text-anchor="end" fill="#1b1f23">  simulated threshold, re-fitted</text>
<rect x="692.4" y="212" width="8.6" height="20" rx="3" fill="#009E73"/>
<text x="708.9" y="226" font-size="12" fill="#1b1f23" font-weight="bold">+3.1</text>
<line x1="250" y1="246" x2="720" y2="246" stroke="#5a6570" stroke-width="1"/>
<text x="24" y="334" font-size="11" fill="#5a6570">Pooled breakpoint 1.73% of chromosome length. Variance in log relative size: 4.7% within families, 95.3% between.</text>
<text x="24" y="350" font-size="11" fill="#5a6570">Copy number is estimated from sequencing coverage, not counted; the source publishes no uncertainty for it.</text>
<text x="24" y="366" font-size="11" fill="#5a6570">Planted breaks are synthetic controls, not observations.</text>
</svg>
