<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" viewBox="0 0 760 386" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The segmented preference is between families, not within them</title>
<desc id="d">Pooled, the two-segment fit beats a single line by dAIC -148.1. Centred on plasmid family it beats it by only -1.3. Three breaks of the pooled magnitude planted into the centred data were recovered by the same test at around dAIC -45, so the near-zero observed value is an absence rather than a test without power.</desc>
<rect width="760" height="386" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="bold" fill="#1b1f23">Most of the bend is between families, not all of it</text>
<text x="24" y="48" font-size="12" fill="#5a6570">&#916;AIC, two segments minus one line. More negative is stronger evidence for a bend.</text>
<line x1="250.0" y1="50" x2="250.0" y2="284" stroke="#d8d8d8" stroke-width="1"/>
<text x="250.0" y="302" font-size="11" fill="#5a6570" text-anchor="middle">0</text>
<line x1="367.5" y1="50" x2="367.5" y2="284" stroke="#d8d8d8" stroke-width="1"/>
<text x="367.5" y="302" font-size="11" fill="#5a6570" text-anchor="middle">&#8722;40</text>
<line x1="485.0" y1="50" x2="485.0" y2="284" stroke="#d8d8d8" stroke-width="1"/>
<text x="485.0" y="302" font-size="11" fill="#5a6570" text-anchor="middle">&#8722;80</text>
<line x1="602.5" y1="50" x2="602.5" y2="284" stroke="#d8d8d8" stroke-width="1"/>
<text x="602.5" y="302" font-size="11" fill="#5a6570" text-anchor="middle">&#8722;120</text>
<line x1="720.0" y1="50" x2="720.0" y2="284" stroke="#d8d8d8" stroke-width="1"/>
<text x="720.0" y="302" font-size="11" fill="#5a6570" text-anchor="middle">&#8722;160</text>
<line x1="250" y1="50" x2="250" y2="284" stroke="#5a6570" stroke-width="2"/>
<text x="238" y="74" font-size="12" text-anchor="end" fill="#1b1f23" font-weight="bold">Pooled, as published</text>
<rect x="250" y="60" width="435.2" height="20" rx="3" fill="#56B4E9"/>
<text x="677.2" y="74" font-size="12" text-anchor="end" fill="#ffffff" font-weight="bold">&#8722;148.1</text>
<text x="238" y="112" font-size="12" text-anchor="end" fill="#1b1f23" font-weight="bold">Knee fixed, family absorbed</text>
<rect x="250" y="98" width="56.9" height="20" rx="3" fill="#D55E00"/>
<text x="314.9" y="112" font-size="12" fill="#1b1f23" font-weight="bold">&#8722;19.4</text>
<text x="238" y="150" font-size="12" text-anchor="end" fill="#1b1f23" font-weight="bold">Family-centred, knee re-fitted</text>
<rect x="250" y="136" width="3.8" height="20" rx="3" fill="#009E73"/>
<text x="261.8" y="150" font-size="12" fill="#1b1f23" font-weight="bold">&#8722;1.3</text>
<text x="238" y="188" font-size="12" text-anchor="end" fill="#1b1f23">   planted control, 25th pct</text>
<rect x="250" y="174" width="132.7" height="20" rx="3" fill="#009E73"/>
<text x="374.7" y="188" font-size="12" text-anchor="end" fill="#ffffff" font-weight="bold">&#8722;45.2</text>
<text x="238" y="226" font-size="12" text-anchor="end" fill="#1b1f23">   planted control, 50th pct</text>
<rect x="250" y="212" width="132.4" height="20" rx="3" fill="#009E73"/>
<text x="374.4" y="226" font-size="12" text-anchor="end" fill="#ffffff" font-weight="bold">&#8722;45.1</text>
<text x="238" y="264" font-size="12" text-anchor="end" fill="#1b1f23">   planted control, 75th pct</text>
<rect x="250" y="250" width="98.8" height="20" rx="3" fill="#009E73"/>
<text x="340.8" y="264" font-size="12" text-anchor="end" fill="#ffffff" font-weight="bold">&#8722;33.6</text>
<line x1="250" y1="284" x2="720" y2="284" stroke="#5a6570" stroke-width="1"/>
<text x="24" y="334" font-size="11" fill="#5a6570">Pooled breakpoint 1.73% of chromosome length. Variance in log relative size: 4.7% within families, 95.3% between.</text>
<text x="24" y="350" font-size="11" fill="#5a6570">Copy number is estimated from sequencing coverage, not counted; the source publishes no uncertainty for it.</text>
<text x="24" y="366" font-size="11" fill="#5a6570">Planted breaks are synthetic controls, not observations.</text>
</svg>
