  <text x="192.0" y="533.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a6570" text-anchor="start" font-weight="normal">the two studies define copy number differently</text>
  <text x="48.0" y="524.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1f23" text-anchor="start" font-weight="normal">A single line and a breakpoint fit the same cloud. Which is right is open; one line drawn alone decides it silently.</text>
