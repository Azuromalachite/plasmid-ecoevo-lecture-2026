# Tracked claims for Plasmid Eco-Evo.
#
# Only reusable, load-bearing claims live here. Status vocabulary and the
# rules for assigning it: evidence-levels.md
#
# Fields:
#   id          stable identifier, never reused or renumbered
#   statement   the claim, as precisely as it can be stated
#   layer       what sort of statement this is:
#               source | interpretation | model | observation | convention
#   status      what the evidence currently says about it:
#               supported | contested | unsupported | refuted | not_tested
#               | not_applicable
#
# The two are independent axes. 'model-derived' and 'definitional' used to sit
# in status; they describe the KIND of statement, so they moved to layer as
# 'model' and 'convention'. A model result can then carry a real status:
# supported within the model, or contested between models.
#
# Before marking anything 'contested', apply SCOPE BEFORE STATUS: check the
# findings make the same claim under comparable host, environment, assay,
# estimator, timescale and definition. Context dependence is not disagreement.
# See evidence-levels.md.
#   references  BibTeX keys in references.bib
#   notes       caveats, scope, and what IS established if the claim is not
#   pages       repository pages that depend on this claim

version: 0.2

claims:
  - id: claim.shewanella.oxa_native_context
    statement: >
      Chromosomal class D beta-lactamases of environmental Shewanella species
      are embedded in the cell's own envelope physiology: their expression is
      regulated through peptidoglycan recycling enzymes and penicillin-binding
      protein 1a / LpoA, not through the canonical AmpR-AmpC induction
      pathway, which Shewanella lacks.
    layer: source
    status: supported
    references:
      - yin2014recycling
      - yin2015pbp1a
    notes: >
      Demonstrated in S. oneidensis for blaA. Loss of AmpG or NagZ strongly
      changes beta-lactam resistance, and inactivation of mrcA or lpoA
      drastically raises blaA expression without beta-lactam exposure. Scope:
      S. oneidensis is the studied representative; the regulatory detail is
      not shown for every Shewanella species carrying a blaOXA-48-like gene.
      CORRECTION (v0.2): poirel2004progenitor was listed here as a supporting
      reference. It is not one for this claim. That paper reports that
      S. oneidensis MR-1 was "susceptible to all beta-lactams" and that
      induction of OXA-54 could not be demonstrated in MR-1, so on the
      regulation question it points the other way. It remains the right
      citation for the 92% identity between OXA-54 and OXA-48, which is a
      separate claim and is made where it belongs.
    verification:
      source_checked: true
      checked_against: full_text
      note: "Yin 2015 Results, mrcA/lpoA transposon screen; Yin 2014 Results, AmpG/NagZ"
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.shewanella.oxa_ancestral_selection
    statement: >
      The historical selective agent that maintained chromosomal
      blaOXA-48-like genes in environmental Shewanella is known.
    layer: interpretation
    status: unsupported
    references:
      - dcosta2011ancient
      - martinez2008natural
      - potron2011oxa181
      - yin2015pbp1a
    notes: >
      This is a deliberately recorded gap, not a refutation. What IS
      supported: resistance determinants long predate therapeutic antibiotic
      use (functional beta-lactam, tetracycline and glycopeptide resistance
      genes recovered from 30,000-year-old permafrost), environmental
      resistance genes need not have arisen under therapeutic selection, and
      the native regulatory context of the Shewanella enzyme is cell-wall
      physiology. What is NOT established: whether the agent for this gene in
      this lineage was environmental beta-lactams from competitors, a
      physiological role in envelope turnover, or neutral retention. Do not
      let the ancient-resistance literature be read as answering this; it
      answers a different question. Downgrade to 'contested' only if direct
      evidence for a specific agent appears.
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.oxa48.mobilization_changes_expression
    statement: >
      Mobilization of blaOXA-48 by IS1999 changed both the gene's location and
      its expression, because the beta-lactamase is transcribed from the
      insertion sequence's own outward-directed promoter.
    layer: source
    status: supported
    references:
      - aubert2006is1999
      - poirel2004emergence
      - poirel2012genetic
    notes: >
      5' RACE located the Pout promoter in IS1999 driving blaOXA-48 and
      blaVEB-1. Caveat for teaching: in the same study, transposition of the
      putative natural Tn1999 itself was below the assay's detection limit,
      although IS1999 and laboratory-constructed IS1999 composite transposons
      did transpose. The evidence that Tn1999 is the mobile unit carrying
      blaOXA-48 onto plasmids is structural, not a measured rate.
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.oxa48.phenotype_needs_host_context
    statement: >
      Clinically significant carbapenem resistance from OXA-48-like enzymes
      requires host context — in particular reduced outer-membrane
      permeability — and is not a property of the enzyme alone.
    layer: source
    status: supported
    references:
      - poirel2012phantom
      - poirel2004emergence
    notes: >
      OXA-48-like enzymes hydrolyse penicillins strongly and carbapenems only
      weakly, sparing broad-spectrum cephalosporins; high-level carbapenem
      resistance appears when enzyme production combines with a permeability
      defect. The index K. pneumoniae isolate 11978 lacked a ~36 kDa porin
      and also expressed several other beta-lactamases, so that single isolate
      does not isolate the porin's contribution on its own.
    verification:
      source_checked: true
      checked_against: full_text
      note: "Poirel 2012 review, hydrolysis profile; Poirel 2004 Results, missing ~36 kDa porin"
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.transfer_is_not_spread
    statement: >
      A detected conjugative transfer event does not establish that a plasmid
      is spreading: contact, transfer, establishment, persistence and
      secondary spread are separate steps, and later steps fail independently
      of transfer rate.
    layer: interpretation
    status: supported
    references:
      - fox2008spatial
      - novick1987incompatibility
      - garcillan2008entry
      - simonsen1990endpoint
      - alonsodelvalle2021variability
    notes: >
      The decomposition into five steps is this project's framing
      (interpretation layer); each individual step is independently evidenced.
      Strongest single demonstration: plasmid pB10 invades E. coli populations
      from a frequency as low as 1e-7 on filters with nutrient replenishment
      but cannot invade in liquid culture, with the same plasmid and host.
    pages:
      - misconceptions/transfer-is-not-spread.md
      - concepts/copy-carry-spread.md

  - id: claim.copy_number.evolution_not_proportional
    statement: >
      Higher plasmid copy number does not produce a proportionally higher
      plasmid evolutionary rate, because segregational drift at cell division
      loses new variants and extends their fixation time.
    layer: source
    status: supported
    references:
      - ilhan2019segregational
      - rodriguezbeltran2018tradeoffs
      - sanmillan2016multicopy
    notes: >
      Experimental evolution of low- and high-copy non-mobile plasmids in
      E. coli, supported by simulation. This does not contradict the finding
      that multicopy carriage potentiates resistance evolution and allows
      escape from fitness trade-offs: those benefits come from allelic
      heterozygosity within a cell, which is a different mechanism from a
      higher substitution rate. Keep the two distinct when teaching.
    pages:
      - misconceptions/more-copy-is-always-better.md
      - concepts/copy-carry-spread.md

  - id: claim.persistence.transfer_can_offset_cost
    statement: >
      Conjugative transfer can maintain a costly plasmid in a population
      without selection for its cargo, at transfer rates that real plasmids
      achieve.
    layer: source
    status: supported
    references:
      - lopatkin2017persistence
      - stewart1977population
      - bergstrom2000natural
      - hernandezbeltran2021models
    notes: >
      The existence condition is classical theory; the empirical part is that
      nine plasmids from six incompatibility groups transfer fast enough for
      maintenance without antibiotics in E. coli. Contested context worth
      recording: Bergstrom et al. argue from empirical transfer rates that
      plasmids generally cannot persist as pure genetic parasites, and propose
      other mechanisms. The two are compatible (different plasmids, hosts and
      conditions) but a teaching page should not present either as the settled
      general answer; the plasmid paradox remains open (carroll2018persistence).
    pages:
      - concepts/fitness-vs-persistence.md
      - concepts/plasmid-vs-host-fitness.md

  - id: claim.fitness.cost_is_host_dependent
    statement: >
      The fitness effect of a given plasmid varies substantially across
      wild-type bacterial hosts, is sometimes beneficial, and that variability
      itself changes the conditions for plasmid persistence.
    layer: source
    status: supported
    references:
      - alonsodelvalle2021variability
      - sanmillan2017costs
      - delafuente2022withinpatient
    notes: >
      Measured for pOXA-48_K8 across ecologically compatible wild-type
      enterobacteria from the human gut; effects tracked host phylogeny. The
      persistence consequence (persistence rising with community diversity and
      depending less on conjugation) is model-derived within that paper, from
      the measured fitness distribution — treat that half as model, not
      observation.
    verification:
      source_checked: true
      checked_against: full_text
      note: "Alonso-del Valle 2021, fitness distribution across wild-type isolates"
    pages:
      - concepts/fitness-vs-persistence.md
      - concepts/plasmid-vs-host-fitness.md
      - concepts/copy-carry-spread.md

  - id: claim.terminology.persistence_boundary
    statement: >
      Absent evidence of self-reinforcing dynamics, bistability or path
      dependence, this project says 'persistence boundary' and 'stability
      landscape' rather than 'tipping point', 'bifurcation', 'bistability' or
      'hysteresis'.
    layer: convention
    status: not_applicable
    references:
      - ashwin2012tipping
    notes: >
      A convention of this repository, not a claim about plasmids. Each of the
      stronger terms carries a commitment a persistence study rarely tests:
      a tipping point needs an abrupt, disproportionate and usually
      hard-to-reverse response, not merely a threshold; a bifurcation needs a
      specified model, parameter and equilibrium structure; bistability needs
      two stable states at identical parameters; hysteresis additionally needs
      a reversed sweep. Deliberately NOT part of the definition: positive
      feedback. Tipping is classified by mechanism into bifurcation-induced,
      noise-induced and rate-induced cases, and rate-induced tipping occurs
      without the tracked equilibrium losing stability, so requiring a
      self-reinforcing loop would be one usage presented as the definition.
      Upgrade the wording when the evidence exists, and say what it was.
    pages:
      - concepts/fitness-vs-persistence.md

  - id: claim.shewanella.blaa_is_oxa54
    statement: >
      The Shewanella oneidensis chromosomal class D beta-lactamase called BlaA
      in the regulation literature is the same enzyme called OXA-54 in the
      carbapenemase literature.
    layer: source
    status: supported
    references:
      - sher2025shewanella
      - poirel2004progenitor
      - yin2015pbp1a
    verification:
      source_checked: true
      checked_against: full_text
      note: "Sher 2025 sec. 8: 'class D beta-lactamase BlaA (also referred to as OXA-54)'"
    notes: >
      Recorded because two literatures describe this gene under two names and
      the case study depends on treating them as one. Without this claim, the
      page silently joins a regulation result about blaA to an identity result
      about OXA-54. The review states the identity directly; it is not an
      inference of ours.
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.environment.natural_carbapenems_exist
    statement: >
      Carbapenems occur as natural products of environmental bacteria,
      independently of clinical antibiotic manufacture.
    layer: source
    status: supported
    references:
      - kahan1979thienamycin
      - parker1982sq27860
    notes: >
      Thienamycin from Streptomyces cattleya and SQ 27,860 from Serratia and
      Erwinia species. Needed to keep a tempting line honest: "nobody was
      dosing sediment with carbapenems" is glib and, read literally, wrong.
      This claim establishes that natural carbapenems exist. It does NOT
      establish that they occurred where or when the Shewanella genes were
      maintained, nor that they were the selective agent. See
      claim.shewanella.oxa_ancestral_selection, which remains unsupported.
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.shewanella.blaa_regulation_not_uniform
    statement: >
      The differing reports of what induces the native Shewanella class D
      beta-lactamase were obtained with different inducers and assays, so they
      do not establish a disagreement; "the gene is inducible" is too flat a
      summary either way.
    layer: interpretation
    status: supported
    references:
      - poirel2004progenitor
      - yin2013blaa
      - yin2015pbp1a
      - yin2014recycling
    notes: >
      RECLASSIFIED in v0.2, and a good test of the new rule. This was status
      'contested'. Applying scope before status: induction of OXA-54 by
      imipenem or cefoxitin could not be demonstrated in S. oneidensis MR-1
      (Poirel 2004), while blaA is strongly induced by high-dose ampicillin
      (Yin 2013) and is regulated through PBP1a/LpoA and peptidoglycan
      recycling (Yin 2015, Yin 2014). Different inducers, different assays:
      the findings are not comparable, so the apparent contradiction is
      condition dependence, not a controversy. Marking it 'contested' would
      have made that label a dumping ground for biological heterogeneity,
      which the narrow definition forbids. What IS supported is the statement
      as now written. Whether a genuine disagreement exists under matched
      conditions is not tested.
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.shewanella.oxa_betalactam_hypothesis
    statement: >
      Environmental beta-lactams produced by competing organisms were the
      historical selective agent maintaining chromosomal blaOXA-48-like genes
      in Shewanella.
    layer: interpretation
    status: not_tested
    references:
      - kahan1979thienamycin
      - parker1982sq27860
      - dcosta2011ancient
    notes: >
      Distinct from claim.shewanella.oxa_ancestral_selection, and the pair
      shows why not_tested and unsupported are different states. That claim
      says "the agent is known" and is UNSUPPORTED: evidence has been examined
      and does not establish it. This one is a specific hypothesis that no
      identified study tests discriminatingly, so it is NOT_TESTED: nobody has
      asked this question in a way that could separate it from the
      alternatives. Natural carbapenems do exist
      (claim.environment.natural_carbapenems_exist), which makes the
      hypothesis coherent rather than idle, but the existence of the compounds
      is not evidence that they acted as the selective agent here.
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.model.plasmid_invasion_threshold
    statement: >
      Under a resource-explicit, well-mixed continuous-culture model with
      mass-action transfer and per-unit-time segregational loss, a rare
      plasmid-bearing class increases when gamma*n_star > c*psi + tau, where
      n_star is the plasmid-free density at the plasmid-free equilibrium.
    layer: model
    status: supported
    references:
      - stewart1977population
      - bergstrom2000natural
      - hernandezbeltran2021models
    verification:
      source_checked: true
      checked_against: own_derivation
      note: >
        Derived in this project, not quoted. Cell balance cancels conjugation
        and segregation exactly (symbolic residual 0); the plasmid-free
        equilibrium is isolated and its Jacobian upper triangular there; the
        invasion eigenvalue is gamma*n_star - c*psi - tau; its sign predicted
        invasion in 59 of 59 numerical samples outside a 5% band around the
        threshold.
    notes: >
      'supported' here means supported WITHIN the stated model: the derivation
      and the numerical checks agree. layer 'model' is what stops this being
      read as an empirical law. An experiment that disagreed would most likely
      show that an assumption fails, not that the algebra is wrong.
      Assumptions that bound it: mass-action transfer, which breaks above
      roughly 1e6 cells/mL in liquid where transfer saturates; a well-mixed
      habitat; per-unit-time segregation, so the threshold must be re-derived
      under a per-division convention; transconjugants transferring like
      donors; and a constant cost. It is an invasion condition, not a
      displacement condition. An earlier two-class formulation was discarded:
      with psi equal to the dilution rate its plasmid-free state is a line of
      equilibria, and its numerical check failed on 11 of 60 samples.
    pages:
      - concepts/fitness-vs-persistence.md

  - id: claim.shewanella.blaa_phenotype_scope
    statement: >
      BlaA raises the minimum inhibitory concentration of three penicillins
      in Shewanella oneidensis (ampicillin 16, penicillin 32, carbenicillin
      64 micrograms per millilitre in the wild type, below 1 in a blaA
      deletion mutant). Whether that constitutes "resistance" depends on the
      breakpoint applied, and no breakpoints are defined for Shewanella.
    layer: source
    status: supported
    references:
      - yin2013blaa
      - poirel2004progenitor
      - sher2025shewanella
      - yin2015pbp1a
    verification:
      source_checked: true
      checked_against: full_text
      note: "Yin 2013 Table 2 (MICs); Poirel 2004 text (14-drug panel)"
    notes: >
      Replaces an earlier page claim of "natural resistance to many
      beta-lactams". That phrasing came from Yin 2015's Introduction prose
      rather than from data; the measured panel is three penicillins, and
      Sher 2025 says "some". NOT COMPARABLE rather than contested: Poirel
      2004 reports MR-1 as susceptible across a 14-drug panel, which looks
      like a flat contradiction, but the laboratories, panels, media and
      interpretive criteria differ, and an ampicillin MIC of 16 sits at or
      below the intermediate range under enterobacterial breakpoints. The
      MIC shift attributable to blaA is not in dispute; the label is.
    pages:
      - case-studies/shewanella-oxa48.md

  - id: claim.shewanella.blaa_dose_gated_lysis
    statement: >
      Ampicillin lyses Shewanella oneidensis at 0.49 to 6.25 micrograms per
      millilitre but not at 50, because blaA induction is dose-dependent: a
      high dose induces strongly and clears the drug, a low dose induces
      weakly and the drug persists.
    layer: source
    status: supported
    references:
      - yin2013blaa
    verification:
      source_checked: true
      checked_against: full_text
      note: "Yin 2013, lysis concentrations and the slow-removal explanation"
    notes: >
      The headline finding of the paper, and a better answer to the case
      study's prediction prompt than the phenotype statement it replaced: the
      native organism is killed by a low dose and survives a high one. Scope:
      one species, one drug, one laboratory. Do not generalise the inverted
      dose-response to other beta-lactams or other Shewanella species; it is
      not tested outside this setting.
    pages:
      - case-studies/shewanella-oxa48.md
